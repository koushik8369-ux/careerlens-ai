spring.application.name=careerlens-backend
server.port=8080

# Load local development variables without committing them; deployment environments can still provide DB_* and JWT_* directly.
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Driven by Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerlens_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.careerlens=DEBUG
logging.level.org.springframework.security=INFO

# JWT configuration (set JWT_SECRET outside source control)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# AI provider configuration. Deterministic is the default and requires no external service.
app.ai.provider=${AI_PROVIDER:deterministic}
app.ai.llm.api-key=${LLM_API_KEY:}
app.ai.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.ai.llm.model=${LLM_MODEL:gpt-4o-mini}
app.ai.llm.timeout=${LLM_TIMEOUT:30s}

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
