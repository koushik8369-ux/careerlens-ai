spring.application.name=careerlens-backend
server.port=8080

# Database Configuration (Driven by Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerlens_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.careerlens=DEBUG
logging.level.org.springframework.security=INFO
