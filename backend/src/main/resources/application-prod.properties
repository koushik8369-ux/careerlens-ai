spring.application.name=careerlens-backend

# Production values must be supplied by the environment or secret manager.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.root=INFO
logging.level.com.careerlens=INFO
logging.level.org.springframework.security=INFO

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.ai.provider=${AI_PROVIDER:deterministic}
app.ai.llm.api-key=${LLM_API_KEY:}
app.ai.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
app.ai.llm.model=${LLM_MODEL:gpt-4o-mini}
app.ai.llm.timeout=${LLM_TIMEOUT:30s}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB