spring.application.name=careerlens-backend-test
server.port=8080

# In-Memory H2 Database for Isolated Unit & Integration Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.com.careerlens=DEBUG

app.jwt.secret=test-secret-that-is-at-least-32-characters-long
app.jwt.expiration=3600000

app.ai.provider=deterministic
app.ai.llm.api-key=
app.ai.llm.base-url=http://localhost:9999/v1
app.ai.llm.model=test-model
app.ai.llm.timeout=1s
